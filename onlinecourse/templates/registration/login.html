{% extends "onlinecourse/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mt-4">Login</h2>
        {% if form.errors %}
        <div class="alert alert-danger">Your username and password didn't match. Please try again.</div>
        {% endif %}
        <form method="post" action="{% url 'onlinecourse:login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username:</label>
                <input type="text" class="form-control" name="username" id="id_username" autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Password:</label>
                <input type="password" class="form-control" name="password" id="id_password">
            </div>
            <input class="btn btn-primary" type="submit" value="Login">
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</div>
{% endblock %}
